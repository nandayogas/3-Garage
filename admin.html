<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — 3 GARAGE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
theme: {
extend: {
colors: { garageRed: '#E31B23', garageDark: '#0A0A0A', garageCard: '#141414', garageBorder: '#262626' },
fontFamily: { barlow: ['"Barlow Condensed"', 'sans-serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
}
}
}
</script>
<style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #f5f5f5; } .font-barlow { font-family: 'Barlow Condensed', sans-serif; }</style>
</head>
<body class="bg-garageDark text-white min-h-screen">
<div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
<div class="bg-garageCard border border-garageBorder p-6 rounded-2xl max-w-sm w-full mx-4 shadow-2xl">
<h3 id="modalTitle" class="font-barlow text-2xl font-bold text-center uppercase mb-2">Informasi</h3>
<p id="modalMessage" class="text-gray-400 text-sm text-center mb-6"></p>
<button onclick="document.getElementById('customModal').classList.add('hidden')" class="w-full py-3 bg-garageRed font-barlow text-lg font-bold uppercase rounded-xl">OK</button>
</div>
</div>
​<header class="sticky top-0 z-40 bg-garageDark/95 border-b border-garageBorder">
<div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
<span class="font-barlow text-2xl font-black uppercase">ADMIN PANEL 3 GARAGE</span>
<a href="index.html" target="_blank" class="px-4 py-2 bg-garageCard border border-garageBorder rounded-xl text-xs font-bold font-barlow uppercase">Lihat Website ↗</a>
</div>
</header>
​<div id="loginScreen" class="min-h-[80vh] flex items-center justify-center px-4">
<div class="bg-garageCard border border-garageBorder p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-4">
<h3 class="font-barlow text-3xl font-black uppercase text-center">LOGIN ADMIN</h3>
<input type="text" id="adminUser" placeholder="Username (admin3garage)" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-white">
<input type="password" id="adminPass" placeholder="Password (garagejaya99)" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-white">
<p id="loginErrorMsg" class="text-red-500 text-xs text-center hidden"></p>
<button onclick="processLogin()" class="w-full py-3.5 bg-garageRed font-barlow text-lg font-bold uppercase rounded-xl shadow-lg">MASUK</button>
</div>
</div>
​<div id="adminDashboard" class="hidden min-h-screen py-10 px-4 max-w-7xl mx-auto space-y-8">
<div class="flex justify-between items-center bg-garageCard border border-garageBorder p-6 rounded-2xl">
<h2 class="font-barlow text-3xl font-black uppercase">CONTROL CENTER</h2>
<div class="flex gap-3">
<button onclick="saveAdminData()" class="px-6 py-3 bg-garageRed font-barlow font-bold uppercase rounded-xl shadow-lg">Simpan Perubahan</button>
<button onclick="logoutAdmin()" class="px-4 py-3 bg-garageDark border border-garageBorder font-barlow font-bold uppercase rounded-xl">Keluar</button>
</div>
</div>
​<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
<div class="bg-garageCard border border-garageBorder p-6 rounded-2xl space-y-4">
<h3 class="font-barlow text-xl font-bold uppercase">Pengaturan Utama</h3>
<textarea id="editHeroText" rows="3" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-xs text-white resize-none"></textarea>
<input type="text" id="editWhatsapp" placeholder="WhatsApp" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-xs text-white">
<input type="text" id="editYoutube" placeholder="YouTube URL" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-xs text-white">
<input type="text" id="editInstagram" placeholder="Instagram URL" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-xs text-white">
<input type="text" id="editTiktok" placeholder="TikTok URL" class="w-full bg-garageDark border border-garageBorder rounded-xl p-3 text-xs text-white">
</div>
​<div class="lg:col-span-2 bg-garageCard border border-garageBorder p-6 rounded-2xl space-y-6">
<h3 class="font-barlow text-xl font-bold uppercase">Kelola Sparepart</h3>
<div class="p-4 bg-garageDark border border-garageBorder rounded-xl space-y-3">
<input type="text" id="newPartTitle" placeholder="Nama Produk" class="w-full bg-garageCard border border-garageBorder rounded-lg p-2.5 text-xs text-white">
<div class="grid grid-cols-2 gap-3">
<input type="text" id="newPartPrice" placeholder="Harga" class="bg-garageCard border border-garageBorder rounded-lg p-2.5 text-xs text-white">
<input type="text" id="newPartStock" placeholder="Stok" class="bg-garageCard border border-garageBorder rounded-lg p-2.5 text-xs text-white">
</div>
<input type="text" id="newPartImage" placeholder="URL Gambar" class="w-full bg-garageCard border border-garageBorder rounded-lg p-2.5 text-xs text-white">
<button onclick="addNewPart()" class="w-full py-2 bg-garageBorder hover:bg-garageRed font-barlow font-bold uppercase rounded-lg">Tambah Produk</button>
</div>
<div id="adminPartsList" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
</div>
</div>
</div>
​<script>
const DEFAULT_DATA = {
heroText: "Spesialis Subaru & Mazda. Perawatan, performa, dan sparepart dengan standar kualitas tertinggi untuk kepuasan berkendara Anda.",
whatsapp: "62895392922023",
youtube: "https://youtu.be/b1qI9p3F__Q",
instagram: "https://www.instagram.com/3garageid/",
tiktok: "https://tiktok.com/@3garage",
parts: [{ title: "Brake Pad Subaru", price: "Rp 1.250.000", stock: "Stok: 10", image: "", description: "Original" }]
};
let siteData = JSON.parse(localStorage.getItem("garage_site_data")) || DEFAULT_DATA;
if (localStorage.getItem("garage_admin_logged") === "true") showDashboard();
​function processLogin() {
if (document.getElementById("adminUser").value === "admin3garage" && document.getElementById("adminPass").value === "garagejaya99") {
localStorage.setItem("garage_admin_logged", "true");
showDashboard();
} else {
let err = document.getElementById("loginErrorMsg");
err.textContent = "Username/Password salah!"; err.classList.remove("hidden");
}
}
function logoutAdmin() {
localStorage.removeItem("garage_admin_logged");
location.reload();
}
function showDashboard() {
document.getElementById("loginScreen").classList.add("hidden");
document.getElementById("adminDashboard").classList.remove("hidden");
document.getElementById("editHeroText").value = siteData.heroText;
document.getElementById("editWhatsapp").value = siteData.whatsapp;
document.getElementById("editYoutube").value = siteData.youtube;
document.getElementById("editInstagram").value = siteData.instagram;
document.getElementById("editTiktok").value = siteData.tiktok;
renderAdminParts();
}
function renderAdminParts() {
document.getElementById("adminPartsList").innerHTML = siteData.parts.map((p, i) => <div class="p-3 bg-garageDark border border-garageBorder rounded-xl flex justify-between items-center"> <div><h5 class="font-barlow font-bold">${p.title}</h5><p class="text-xs text-garageRed">${p.price} • ${p.stock}</p></div> <button onclick="siteData.parts.splice(${i},1);renderAdminParts()" class="px-3 py-1.5 bg-red-500/20 text-red-500 rounded-lg text-xs font-bold">Hapus</button> </div>).join("");
}
function addNewPart() {
let t = document.getElementById("newPartTitle").value.trim();
if (!t) return alert("Nama produk wajib diisi!");
siteData.parts.push({ title: t, price: document.getElementById("newPartPrice").value, stock: document.getElementById("newPartStock").value, image: document.getElementById("newPartImage").value });
document.getElementById("newPartTitle").value = ""; renderAdminParts();
}
function saveAdminData() {
siteData.heroText = document.getElementById("editHeroText").value;
siteData.whatsapp = document.getElementById("editWhatsapp").value;
siteData.youtube = document.getElementById("editYoutube").value;
siteData.instagram = document.getElementById("editInstagram").value;
siteData.tiktok = document.getElementById("editTiktok").value;
localStorage.setItem("garage_site_data", JSON.stringify(siteData));
alert("Data berhasil disimpan!");
}
</script>
</body>
</html>
